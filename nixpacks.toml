providers = ["node"]

[phases.setup]
aptPkgs = ["...", "python3", "make", "g++", "git", "curl", "ca-certificates", "lsof", "openssl", "procps"]

[phases.install]
cmds = ["npm exec --yes --package=pnpm@11.2.2 -- pnpm --version", "npm exec --yes --package=pnpm@11.2.2 -- pnpm --config.minimum-release-age=0 install --no-frozen-lockfile --prod=false"]

[phases.build]
cmds = ["p11(){ env pnpm_config_verify_deps_before_run=false npm exec --yes --package=pnpm@11.2.2 -- pnpm --config.minimum-release-age=0 \"$@\"; }; p11 canvas:a2ui:bundle || (mkdir -p extensions/canvas/src/host/a2ui && printf '/* A2UI bundle unavailable in this build */\\n' > extensions/canvas/src/host/a2ui/a2ui.bundle.js && printf 'stub\\n' > extensions/canvas/src/host/a2ui/.bundle.hash && rm -rf vendor/a2ui apps/shared/OpenClawKit/Tools/CanvasA2UI); OPENCLAW_RUN_NODE_SKIP_DTS_BUILD=1 NODE_OPTIONS=--max-old-space-size=8192 p11 build:docker && OPENCLAW_PREFER_PNPM=1 p11 ui:build"]

[start]
cmd = "bash deploy/railway/start.sh"
